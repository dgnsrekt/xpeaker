<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:440px; height:280px; }
  body { font-family:-apple-system,"SF Pro Display","Helvetica Neue",Arial,sans-serif;
    background:#000; color:#e7e9ea; -webkit-font-smoothing:antialiased; }
  .stage {
    position:relative; width:440px; height:280px; overflow:hidden; padding:30px 32px;
    display:flex; flex-direction:column; justify-content:space-between;
    background:
      radial-gradient(360px 230px at 6% 4%, rgba(29,155,240,.30), transparent 60%),
      radial-gradient(320px 240px at 100% 104%, rgba(120,86,255,.16), transparent 55%),
      #000;
  }
  .brand { display:flex; align-items:center; gap:13px; }
  .brand img { width:46px; height:46px; border-radius:12px; }
  .brand span { font-size:30px; font-weight:800; letter-spacing:-.5px; }
  h1 { font-size:29px; line-height:1.12; font-weight:800; letter-spacing:-.8px; }
  h1 .hl { color:#1d9bf0; }
  .sub { margin-top:9px; font-size:13.5px; line-height:1.4; color:#9aa6b2; max-width:360px; }
  .foot { font-size:11.5px; color:#5a6470; letter-spacing:.3px; }
  .wave { position:absolute; right:26px; top:34px; display:flex; align-items:flex-end; gap:5px; opacity:.55; }
  .wave i { width:6px; border-radius:4px; background:linear-gradient(#1d9bf0,#1a6fd0); }
</style>
</head>
<body>
  <div class="stage">
    <div class="brand"><img src="../icons/icon128.png"><span>Xpeaker</span></div>
    <div>
      <h1>Read X <span class="hl">out loud.</span></h1>
      <p class="sub">Focus Mode reader · on-device mood · live ticker shaders · natural neural voices.</p>
    </div>
    <div class="foot">Free · Open source · Runs on your device</div>
    <div class="wave" id="wave"></div>
  </div>
<script>
  var w = document.getElementById('wave');
  for (var b=0; b<9; b++) { var el=document.createElement('i'); var h=10+Math.abs(((b*b+5)%9))*8; el.style.height=h+'px'; w.appendChild(el); }
</script>
</body>
</html>
